<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="keywords" content="Gerador de senhas">
    <title>Gerador de Senha</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <h1 class="logo">Gerador de Senhas</h1>

    <main class="container-input">
        <span>Tamanho <span id="valor"></span> caracteres</span>
        <input id="slider" class="slider" type="range" min="5" max="25" value="15">

        <button id="button" class="button-cta" onclick="generatePassword()">Gerar senha</button>
    </main>

    <div id="container-password" class="container-password hide" onclick="copyPassword()">
        <span class="title">Sua senha gerada foi:</span>
        <span id="password" class="password">123123123</span>
        <span class="tooltip">Clique na senha para copiar.</span>
    </div>

    <footer class="footer">
        <p>Desenvolvido por <a href="https://www.instagram.com/adking.dev" target="_blank">@adking.dev</a></p>
    </footer>

    <script src="scripts/script.js"></script>
</body>
</html>
